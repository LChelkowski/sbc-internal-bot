<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SBC Internal FAQ Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --sbc-primary: #279ECD; /* Blue */
      --sbc-dark:    #51514F; /* Dark Gray */
      --sbc-gray:    #A0A3A0; /* Mid Gray */
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px) } to { opacity:1; transform:none } }
    .animate-fadeIn { animation: fadeIn .18s ease-out }
  </style>
</head>
<body class="bg-[var(--sbc-gray)]/10 text-[var(--sbc-dark)] antialiased h-screen flex flex-col">

  <!-- Header -->
  <header class="p-4 shadow flex items-center gap-3 bg-[var(--sbc-primary)] text-white">
    <img src="logo.png" alt="SBC Logo"
         class="h-10 w-10 rounded-lg bg-white object-contain p-1 hidden sm:block"
         onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='grid';" />
    <div id="logo-fallback"
         class="hidden h-10 w-10 rounded-lg bg-white text-[var(--sbc-primary)] font-bold grid place-items-center">SBC</div>
    <div>
      <h1 class="text-lg font-semibold">SBC Internal FAQ Bot</h1>
      <p class="text-xs opacity-80">Recruitment & Events Helper</p>
    </div>
  </header>

  <!-- Chat area -->
  <main id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></main>

  <!-- Input area -->
  <footer class="border-t border-[color:var(--sbc-gray)]/40 bg-white">
    <div class="max-w-3xl mx-auto p-3 flex flex-col gap-2">
      <div class="flex gap-2">
        <textarea id="q" rows="1" placeholder="Type your question…"
          class="flex-1 resize-none rounded-xl border px-3 py-2 focus:outline-none
                 focus:ring-2 focus:ring-[var(--sbc-primary)]/50"></textarea>
        <button id="ask"
          class="rounded-xl px-5 py-2 text-white bg-[var(--sbc-primary)]
                 hover:brightness-95 active:brightness-90 transition">
          Ask
        </button>
      </div>
      <div class="flex items-center gap-2">
        <input id="key" type="password" placeholder="Access key"
          class="rounded-xl border px-3 py-1 text-sm focus:outline-none
                 focus:ring-2 focus:ring-[var(--sbc-primary)]/40" />
        <button id="saveKey" class="text-sm text-[color:var(--sbc-dark)] hover:underline">Save Key</button>
      </div>
    </div>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const q = document.getElementById('q');
    const askBtn = document.getElementById('ask');
    const keyInput = document.getElementById('key');
    const saveKeyBtn = document.getElementById('saveKey');

    keyInput.value = localStorage.getItem('sbc_key') || '';
    saveKeyBtn.onclick = () => { localStorage.setItem('sbc_key', keyInput.value); };

    function bubble(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
      const b = document.createElement('div');
      b.className = (role === 'user')
        ? 'px-4 py-2 rounded-2xl max-w-[75%] animate-fadeIn text-white bg-[var(--sbc-primary)]'
        : 'px-4 py-2 rounded-2xl max-w-[75%] animate-fadeIn text-[var(--sbc-dark)] bg-[var(--sbc-gray)]/20';
      b.textContent = text;
      wrap.appendChild(b);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const key = localStorage.getItem('sbc_key') || keyInput.value;
      const question = q.value.trim();
      if (!question) return;
      bubble('user', question);
      q.value = '';
      bubble('bot', 'Thinking…');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        chat.lastChild.firstChild.textContent = data.answer || data.error || 'No answer.';
      } catch {
        chat.lastChild.firstChild.textContent = "⚠️ Error talking to the server.";
      }
    }

    askBtn.onclick = send;
    q.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
